server:
  tomcat:
    max-http-post-size: 104857600  # 100MB, phòngdừng恶ýlớnVui lòngthân yêu cầu攻击
spring:
  profiles:
    active: demo
  application:
    name: medical
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  datasource:
    maxActive: 20
    initialSize: 5
    minIdle: 5
    maxWait: 6000
    maxPoolPreparedStatementPerConnectionSize: 20
    timeBetweenEvictionRunsMillis: 6000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  main:
    allow-bean-definition-overriding: true    #khi遇Đếncùngnhưtênchữ của  giờchờ, Có hay khôngCho phép ghi đè đăng ký
    allow-circular-references: true
  cache:
    type: none
  #bản việncấu hình(mởnguồnbảnVui lòngTheoCấu hình môi trường thực tế)
  hosconfig:
    hos-token-url: ${HOS_TOKEN_URL:}
    hos-data-server-url: ${HOS_DATA_SERVER_URL:}
    app-id: ${HOS_APP_ID:}
    organize-id: ${HOS_ORGANIZE_ID:}
  #Cấu hình BHYT
  medicare:
    check: false #mởCấu hình BHYT
    province:     #Tỉnh BHYT
    url:          #giao diệnĐịa chỉ
    #web-url: http://prescription-service:8101/api/YibaoWeb    #bộ署Địa chỉlấydùngBHYT trong giữatruy cập tệp và docker trong dịch vụTênbộ署tươngtương ứng
    web-url: http://127.0.0.1:8101/api/YibaoWeb    # trong giữatệpĐịa chỉ
    isDemo: false #Có hay khôngdemomôi trường
    #Đơn thuốc điện tử
    web-port: 7020  #Số cổng frontend dùng để truy cập in ấnĐơn thuốcđơn
logging:
  level:
    com.geeke.gen.dao.*: debug
    com.geeke.admin.dao.*: debug
    com.geeke.sys.dao.*: debug
    org.camunda: debug
    com.geeke.gen: debug
    com.geeke.stock.dao.*: debug
# mybatis-plusCấu hình
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    auto-mapping-behavior: FULL
    map-underscore-to-camel-case: true
    default-executor-type: SIMPLE
    local-cache-scope: SESSION

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

genConfigure:
  dbName: mysql                          #Dữ liệukhoLoại:  mysql/oracle/mssql

app:
  cache:
    type: none  # Tùy chọn redis, none, ehcache

# Blocker 8a: monitoring chỉ cần /actuator/health. Chỉ expose đúng health qua web;
# các endpoint actuator khác không expose, và Shiro vẫn chặn chúng bằng authc
# (xem ShiroConfiguration: chỉ "/actuator/health" là anon).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never




